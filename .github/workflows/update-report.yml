name: Update VARUS daily report

on:
  schedule:
    # GitHub Actions cron is UTC. Check the 09:00 Kyiv window in both UTC
    # offsets so the refresh stays on Kyiv time after daylight-saving changes.
    # GitHub may drop individual scheduled events, so retry every five minutes.
    - cron: "*/5 6,7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    concurrency:
      group: varus-daily-refresh
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Kyiv time
        id: kyiv-time
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=Europe/Kyiv date +%H)" != "09" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif python - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo

          report = json.load(open("data.json", encoding="utf-8"))
          refreshed_today = datetime.fromisoformat(report["updated_at"]).astimezone(
              ZoneInfo("Europe/Kyiv")
          ).date() == datetime.now(ZoneInfo("Europe/Kyiv")).date()
          raise SystemExit(0 if refreshed_today else 1)
          PY
          then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.kyiv-time.outputs.run == 'true'
        run: pip install -r requirements.txt
      - name: Fetch Databricks data
        if: steps.kyiv-time.outputs.run == 'true'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          DATABRICKS_HTTP_PATH: ${{ secrets.DATABRICKS_HTTP_PATH }}
        run: python generate_report.py
      - name: Commit refreshed report
        if: steps.kyiv-time.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json daily.csv weekly.csv cities.csv
          git diff --cached --quiet || git commit -m "Refresh daily VARUS report"
          git push
